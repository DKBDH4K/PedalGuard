<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();

    window.signUp = function () {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      createUserWithEmailAndPassword(auth, email, password)
        .then(() => {
          alert("Sign-up successful! Redirecting to login...");
          window.location.href = 'login.html';
        })
        .catch((error) => {
          alert(`Error: ${error.message}`);
        });
    };
  </script>
</head>

<body class="bg-gradient-to-r from-blue-200 via-purple-200 to-pink-200 h-screen flex items-center justify-center">

  <div class="bg-white/30 backdrop-blur-md p-8 rounded-xl shadow-xl w-full max-w-md border border-white/40">
    <h2 class="text-3xl font-bold text-gray-800 mb-6 text-center">Sign Up</h2>
    
    <form onsubmit="event.preventDefault(); signUp();">
      <div class="mb-4">
        <label class="block text-gray-700 mb-2" for="username">Username</label>
        <input
          class="w-full p-3 rounded bg-white/70 text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-400"
          id="username" type="text" placeholder="Choose a username" required />
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 mb-2" for="email">Email</label>
        <input
          class="w-full p-3 rounded bg-white/70 text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-400"
          id="email" type="email" placeholder="Enter your email" required />
      </div>

      <div class="mb-6">
        <label class="block text-gray-700 mb-2" for="password">Password</label>
        <input
          class="w-full p-3 rounded bg-white/70 text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-400"
          id="password" type="password" placeholder="Enter your password" required />
      </div>

      <button
        class="w-full bg-purple-500 text-white p-3 rounded-lg font-semibold hover:bg-purple-600 transition duration-300"
        type="submit">Sign Up</button>
    </form>

    <p class="text-gray-700 mt-6 text-center">
      Already have an account?
      <a class="text-purple-600 hover:underline" href="login.html">Login</a>
    </p>
  </div>

</body>
</html>
